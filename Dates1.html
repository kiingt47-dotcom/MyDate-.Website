<!DOCTYPE html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Date"s DATE FIX</title></head>
<link rel="stylesheet" href="Dates1.css">
<body>
<div class="main">
    <div class="m1">
    <input type="date" id="date">
   <img class="teddy" src="Teddy7.gif">
    <h1>Thankyou My LOVE For Accepting Date😘</h1>
    <h2>Now Above lock the date For Our Date.💘</h2>
    <button type="button" id="continueBtn"> Continue ❤️</button>
    

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtXr_eyTvYeFC8KvJmwy6_53C_cD2tSHi8M7Nfki4-hyOmJtrPB73kT7nWA9e0mdqq/exec";



const params = new URLSearchParams(window.location.search);
const senderID = params.get("sender");

const continueBtn = document.getElementById("continueBtn");
const dateInput = document.getElementById("date");

continueBtn.onclick = async function () {

    // Check date first
    const selectedDate = dateInput.value;

    if (!selectedDate) {
        alert("Please select a date ❤️");
        return;
    }

    // Disable button while saving
    continueBtn.disabled = true;
    continueBtn.innerText = "Saving... ❤️";

    // Normal website = NORMAL
    // Personal link = actual sender ID
    const senderToSave = senderID || "NORMAL";

    try {

        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                sender: senderToSave,
                date: selectedDate
            })
        });

        // Go to next page
        window.location.href = "Dates2.html";

    } catch (error) {

        console.log(error);

        alert("Something went wrong. Please try again ❤️");

        continueBtn.disabled = false;
        continueBtn.innerText = "Continue";
    }
};


</script>

    </div>
    </div>
</body>
</html>
